<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Café Franca</title>
</head>
<body>
    <div id="login-box">
        <h2>Login</h2>
        <input id="email" type="email" placeholder="email">
        <input id="password" type="password" placeholder="password">
        <button id="login-btn">Войти</button>
        <p id="login-error" style="color:red;"></p>
    </div>

    <div id="admin-box" style="display:none;">
        <button id="logout-btn">Выйти</button>

        <h2>Категории</h2>
        <div id="cat-list"></div>
            <input id="cat-name" type="text" placeholder="Новая категория">
            <button id="add-cat-btn">Добавить категорию</button>
        <h2>Меню</h2>

        <div id="form-box">
            <h3 id="form-title">Новое блюдо</h3>
            <input id="f-id" type="hidden">
            <select id="f-category"></select>
            <input id="f-name" type="text" placeholder="Название">
            <input id="f-description" type="text" placeholder="Описание">
            <input id="f-price" type="number" step="0.01" placeholder="Цена">
            <input id="f-image" type="file" accept="image/*">
            <img id="f-preview" style="max-width:100px; display:none;">
            <button id="save-btn">Сохранить</button>
            <button id="cancel-btn" style="display:none;">Отмена</button>
            <p id="form-msg"></p>
        </div>

        <div id="items-list"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/admin.js"></script>
</body>
</html>
