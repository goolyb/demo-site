<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Café Franca</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div id="login-box">
        <h2>Login</h2>
        <input id="email" type="email" placeholder="email">
        <input id="password" type="password" placeholder="password">
        <button id="login-btn">Log in</button>
        <p id="login-error" style="color:red;"></p>
    </div>

    <div id="admin-box" style="display:none;">
        <button id="logout-btn">Log out</button>

        <h2>Categories</h2>
        <div id="cat-list"></div>
            <input id="cat-name" type="text" placeholder="New category">
            <button id="add-cat-btn">Add category</button>
        <h2>Menu</h2>

        <div id="form-box">
            <h3 id="form-title">New item</h3>
            <input id="f-id" type="hidden">
            <select id="f-category"></select>
            <input id="f-name" type="text" placeholder="Name">
            <input id="f-description" type="text" placeholder="Description">
            <input id="f-price" type="number" step="0.01" placeholder="Price">
            <input id="f-image" type="file" accept="image/*">
            <img id="f-preview" style="max-width:100px; display:none;">
            <button id="save-btn">Save</button>
            <button id="cancel-btn" style="display:none;">Cancel</button>
            <p id="form-msg"></p>
        </div>

        <div id="items-list"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/admin.js"></script>
</body>
</html>
