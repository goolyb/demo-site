<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Café Franca — Contact preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#161310;
    --bg-soft:#1e1a16;
    --espresso:#4b240c;
    --cream:#fdd8a5;
    --cream-light:#fff6ea;
    --accent: #ff9f3d;
    --accent-bright:#f1ad46;
    --field:rgba(255,255,255,.04);
    --field-border:rgba(255,255,255,.12);
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  body{
    font-family:'DM Sans',sans-serif;
    background:var(--bg);
    color:var(--cream-light);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:60px 24px;
    position:relative;
    overflow-x:hidden;
  }
  /* еле заметные концентрические дуги, как в референсе */
  body::before,body::after{
    content:"";
    position:fixed;
    width:900px;height:900px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.04);
    box-shadow:
      0 0 0 120px rgba(255,255,255,.02),
      0 0 0 260px rgba(255,255,255,.015);
    pointer-events:none;
  }
  body::before{top:-360px;left:-300px;}
  body::after{bottom:-420px;right:-340px;}

  .contact-wrapper{
    display:grid;
    grid-template-columns:0.95fr 1.05fr;
    gap:56px;
    width:100%;
    max-width:1080px;
    align-items:stretch;
    position:relative;
    z-index:1;
  }

  /* ---------- LEFT: gradient card ---------- */
  .contact-info{
    position:relative;
    border-radius:22px;
    padding:40px 36px;
    background:linear-gradient(155deg,#e8943f 0%,#c9772f 45%,#a85c1f 100%);
    color:#fff;
    overflow:hidden;
  }
  .contact-info::after{ /* мягкий блик сверху */
    content:"";position:absolute;inset:0;
    background:radial-gradient(70% 50% at 20% 0%,rgba(255,255,255,.28),transparent 60%);
    pointer-events:none;
  }
  .contact-info > *{position:relative;z-index:1;}

  .contact-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:2.6rem;
    line-height:1.05;
    margin-bottom:28px;
  }

  .info-group{margin-bottom:22px;}
  .info-group h3{
    font-size:.95rem;
    font-weight:600;
    margin-bottom:4px;
  }
  .info-group p,.info-group a{
    display:block;
    font-size:.95rem;
    font-weight:400;
    color:rgba(255,255,255,.85);
    text-decoration:none;
    line-height:1.5;
    transition:color .2s ease, transform .2s ease;
  }
  .info-group a:hover{color:#fff;transform:translateX(3px);}

  .socials{display:flex;gap:12px;margin-top:30px;}
  .socials a{
    width:38px;height:38px;
    display:grid;place-items:center;
    border-radius:10px;
    background:rgba(255,255,255,.16);
    color:#fff;
    font-size:1rem;
    text-decoration:none;
    transition:background .2s ease, transform .2s ease;
  }
  .socials a:hover{background:rgba(255,255,255,.3);transform:translateY(-2px);}

  /* ---------- RIGHT: form ---------- */
  .contact-form{padding:8px 0;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;}

  .field{margin-bottom:20px;}
  .field label{
    display:block;
    font-size:.85rem;
    color:rgba(255,246,234,.65);
    margin-bottom:8px;
  }
  .field input,.field textarea{
    width:100%;
    background:var(--field);
    border:1px solid var(--field-border);
    border-radius:10px;
    padding:13px 15px;
    color:#fff;
    font-family:inherit;
    font-size:.98rem;
    transition:border-color .2s ease, background .2s ease;
  }
  .field input::placeholder,.field textarea::placeholder{color:rgba(255,246,234,.3);}
  .field input:focus,.field textarea:focus{
    outline:none;border-color:var(--accent-bright);background:rgba(255,255,255,.07);
  }
  .field textarea{resize:vertical;min-height:96px;}

  .consent{display:flex;gap:10px;align-items:flex-start;margin:6px 0 22px;font-size:.85rem;color:rgba(255,246,234,.6);}
  .consent input{margin-top:3px;accent-color:var(--accent-bright);}
  .consent a{color:var(--accent-bright);}

  .submit{
    width:100%;
    background:var(--accent-bright);
    color:var(--espresso);
    border:none;
    border-radius:10px;
    padding:15px;
    font-family:'DM Sans',sans-serif;
    font-weight:600;
    font-size:1rem;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .2s ease, filter .2s ease;
  }
  .submit:hover{transform:translateY(-2px);filter:brightness(1.05);box-shadow:0 14px 28px -12px rgba(241,173,70,.7);}

  @media(max-width:820px){
    .contact-wrapper{grid-template-columns:1fr;gap:32px;}
    .form-row{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
  <div id="contact" class="contact-wrapper">

    <!-- LEFT -->
    <div class="contact-info">
      <h1 class="contact-title">Get in touch</h1>

      <div class="info-group">
        <h3>Visit us</h3>
        <p>Come and say hello at our café.</p>
        <a href="https://www.google.com/maps?q=Café+Franca+Hiltenspergerstraße+24+München" target="_blank">Hiltenspergerstraße 24, München</a>
      </div>

      <div class="info-group">
        <h3>Chat to us</h3>
        <p>Our friendly team is here to help.</p>
        <a href="https://mail.google.com/mail/?view=cm&to=hello@cafefranca.de" target="_blank">hello@cafefranca.de</a>
      </div>

      <div class="info-group">
        <h3>Call us</h3>
        <p>Mon – Fri: 08:00 – 20:00</p>
        <a href="tel:+498941527836">+49 89 4152 7836</a>
      </div>

      <div class="socials">
        <a href="#" aria-label="Instagram">📷</a>
        <a href="#" aria-label="Facebook">f</a>
        <a href="#" aria-label="X">✕</a>
        <a href="#" aria-label="LinkedIn">in</a>
      </div>
    </div>

    <!-- RIGHT -->
    <form class="contact-form" onsubmit="return false;">
      <div class="form-row">
        <div class="field">
          <label for="first">First Name</label>
          <input id="first" type="text" placeholder="Jane">
        </div>
        <div class="field">
          <label for="last">Last Name</label>
          <input id="last" type="text" placeholder="Doe">
        </div>
      </div>

      <div class="field">
        <label for="company">Company Name</label>
        <input id="company" type="text" placeholder="Optional">
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com">
      </div>

      <div class="field">
        <label for="phone">Phone Number</label>
        <input id="phone" type="tel" placeholder="+49 ...">
      </div>

      <div class="field">
        <label for="msg">Message</label>
        <textarea id="msg" placeholder="Tell us what we can help you with"></textarea>
      </div>

      <label class="consent">
        <input type="checkbox">
        <span>I'd like to receive more information about Café Franca and I agree to the <a href="#">Privacy Policy</a>.</span>
      </label>

      <button class="submit" type="submit">Send Message</button>
    </form>

  </div>
</body>
</html>
